<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Вход — BriefOps</title><link rel="stylesheet" href="/styles.css?v=3"><script src="/auth.js?v=3" defer></script></head>
<body class="login-page"><main class="login-card"><a class="brand" href="/">brief<span class="brand-light">ops</span></a><div class="eyebrow">WORLD OF VIBECRAFT</div><h1>Рабочий кабинет</h1><p>Заявки с сайта, проверка ответов и отправка писем клиентам. Вход доступен владельцу рабочей области.</p><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="email" required placeholder="Ваш email"></label><div id="otpGroup" hidden><label>Код из письма<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000"></label><button class="text-link" type="button" id="changeEmail">Указать другой адрес</button></div><p id="loginMessage" role="status" aria-live="polite"></p><button id="loginSubmit" class="button primary" type="submit">Получить код</button></form><a class="text-link" href="/">Открыть демонстрацию →</a></main></body></html>
